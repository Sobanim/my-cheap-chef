<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Dish scene matrix — 5 categories x 4 cooking methods</title>
<desc>Every animated SVG scene used by the app, laid out by recipe category and cooking method. Filled cells are drawn scenes; empty cells are combinations that are not real food.</desc>
<style>
:root{--ink:#2b2b2b;--label:#57534e;--muted:#8a8a8a}
@media (prefers-color-scheme:dark){:root{--ink:#e8e3d9;--label:#a8a29e;--muted:#8a8a8a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.hd{font-size:15px;fill:var(--ink)}
.lb{font-size:13px;fill:var(--label)}
.cell{fill:none;stroke:var(--ink)}
@keyframes hR{0%{transform:translateY(1.2px);opacity:0}30%{opacity:.9}100%{transform:translateY(-2.2px);opacity:0}}
@keyframes sR{0%{transform:translateY(2px);opacity:0}25%{opacity:.85}100%{transform:translateY(-9px);opacity:0}}
@keyframes sw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.hA{animation:hR 2.6s ease-in-out infinite}
.hB{animation:hR 2.6s ease-in-out infinite .6s}
.hC{animation:hR 2.6s ease-in-out infinite 1.2s}
.sA{animation:sR 2.4s ease-in-out infinite}
.sB{animation:sR 2.4s ease-in-out infinite .5s}
.sC{animation:sR 2.4s ease-in-out infinite 1s}
.lf{animation:sw 2.8s ease-in-out infinite;transform-origin:12px 15px}
.lf2{animation:sw 2.8s ease-in-out infinite .5s;transform-origin:12px 15px}
.bbA{animation:bb 2s ease-in-out infinite}
.bbB{animation:bb 2s ease-in-out infinite .4s}
@media (prefers-reduced-motion:reduce){.hA,.hB,.hC,.sA,.sB,.sC,.lf,.lf2,.bbA,.bbB{animation:none}}
</style>

<text x="30" y="30" class="hd">Dish scene matrix</text>
<text x="205" y="62" class="lb" text-anchor="middle">pan</text>
<text x="320" y="62" class="lb" text-anchor="middle">oven</text>
<text x="435" y="62" class="lb" text-anchor="middle">pot</text>
<text x="550" y="62" class="lb" text-anchor="middle">raw</text>
<text x="30" y="122" class="lb">meat</text>
<text x="30" y="232" class="lb">pasta</text>
<text x="30" y="342" class="lb">soup</text>
<text x="30" y="452" class="lb">veggie</text>
<text x="30" y="562" class="lb">dessert</text>

