<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Chef's hat silhouette (branded orange accent) -->
  <path
    d="M6 20.5v-6.2a4.7 4.7 0 0 1-1.3-8.9A4.6 4.6 0 0 1 12 3.2a4.6 4.6 0 0 1 7.3 2.2 4.7 4.7 0 0 1-1.3 8.9v6.2A1.5 1.5 0 0 1 16.5 22h-9A1.5 1.5 0 0 1 6 20.5Z"
    stroke="#ff6d00"
    stroke-width="1.3"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Bottom band line -->
  <line
    x1="6"
    y1="20.5"
    x2="18"
    y2="20.5"
    stroke="#ff6d00"
    stroke-width="1.3"
  />

  <!-- Elegant 3-Prong Fork -->
  <g stroke="#ff6d00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
