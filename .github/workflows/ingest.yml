name: Weekly Product Ingestion

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 4:00 UTC (around 6:00 AM Slovak time)
  workflow_dispatch: # Allows manual triggering from the Actions tab on GitHub

permissions:
  contents: write # Grants the right to push changes to the repository

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run parser
        run: npm run data:parse

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          # Checking if the file has changed to avoid creating empty commits
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(data): auto-update products.json [skip ci]"
            git push
          fi
