name: Weekly Recipe Generation

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 4:00 UTC (around 6:00 AM Slovak time)
  workflow_dispatch: # Allows manual triggering from the Actions tab on GitHub

permissions:
  contents: write # Grants the right to push the generated recipe.json

jobs:
  generate-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate recipes from live Lidl discounts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run recipe:generate

      - name: Commit and push recipe.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipe.json
          # Skip empty commits when nothing changed
          if git diff --cached --quiet; then
            echo "No recipe changes detected."
          else
            git commit -m "chore(data): auto-update recipe.json [skip ci]"
            git push
          fi
