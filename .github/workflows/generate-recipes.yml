name: Weekly Recipe Generation

on:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 2:00 UTC (around 4:00 AM Slovak time)
  workflow_dispatch: # Allows manual triggering from the Actions tab on GitHub

permissions:
  contents: write # Grants the right to push the generated recipe.json

jobs:
  generate-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Parses the weekly flyer into a product catalog, then generates recipes from it.
      # Falls back to the live Lidl API on its own if the catalog pipeline fails,
      # so this step succeeding does not by itself mean the flyer was parsed —
      # check the log for the fallback warning.
      - name: Run the weekly pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run weekly

      - name: Commit and push generated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipe.json data/catalog.json data/price-history.jsonl
          # Skip empty commits when nothing changed
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): auto-update weekly catalog and recipes [skip ci]"
            git push
          fi
